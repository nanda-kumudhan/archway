[main]
font=JetBrainsMono Nerd Font:pixelsize=15
font-bold=JetBrainsMono Nerd Font:style=Bold:pixelsize=15
font-italic=JetBrainsMono Nerd Font:style=Italic:pixelsize=15
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:pixelsize=15
bold-text-in-bright=no
pad=10x8 center
dpi-aware=yes
# Large enough for fastfetch's multi-column output while still fitting typical
# floating Sway windows cleanly.
initial-window-size-chars=120x38

[csd]
preferred=none

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
